<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- Social preview source (1280x640). Layout: text block and code window share
       the vertical band y=148..492 (148px top/bottom margins); 96px side margins.
       Render to PNG with a headless browser screenshot at 1280x640, scale factor 1. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8825a"/>
      <stop offset="1" stop-color="#f2b37a"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1c2431"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- text block: cap top 148, last baseline 487 -->
  <rect x="96" y="150" width="8" height="178" rx="4" fill="url(#accent)"/>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <text x="132" y="209" font-size="84" font-weight="800" fill="#f0f3f8" letter-spacing="-2">Claude Reverse</text>
    <text x="132" y="305" font-size="84" font-weight="800" fill="url(#accent)" letter-spacing="-2">Engineering Skill</text>
    <text x="96" y="381" font-size="32" font-weight="500" fill="#c3cbd7">Understand any app with your AI coding agent</text>
    <text x="96" y="429" font-size="23" fill="#8b97a8">Claude Code · Codex · Cursor · Gemini CLI · GitHub Copilot</text>
    <text x="96" y="487" font-size="21" fill="#8b97a8" font-family="Cascadia Code, Consolas, monospace">github.com/EncidXVII/claude-reverse-engineering-skill</text>
  </g>

  <!-- decorative code window: x 872..1184 (96px right margin), y 148..492 -->
  <g transform="translate(872 148)">
    <rect width="312" height="344" rx="14" fill="#121823" stroke="#232c3a"/>
    <path d="M14 0 H298 A14 14 0 0 1 312 14 V40 H0 V14 A14 14 0 0 1 14 0 Z" fill="#151c28"/>
    <line x1="0" y1="40" x2="312" y2="40" stroke="#232c3a"/>
    <circle cx="22" cy="20" r="5" fill="#2c3646"/>
    <circle cx="40" cy="20" r="5" fill="#2c3646"/>
    <circle cx="58" cy="20" r="5" fill="#2c3646"/>
    <!-- 10 rows, 27px apart: 28px padding under the bar, 26px above the bottom -->
    <rect x="22"  y="68"  width="70"  height="9" rx="4.5" fill="#e8825a"/>
    <rect x="100" y="68"  width="120" height="9" rx="4.5" fill="#3a4658"/>
    <rect x="40"  y="95"  width="150" height="9" rx="4.5" fill="#7fd1a8" opacity="0.8"/>
    <rect x="40"  y="122" width="96"  height="9" rx="4.5" fill="#3a4658"/>
    <rect x="144" y="122" width="120" height="9" rx="4.5" fill="#f2b37a" opacity="0.85"/>
    <rect x="40"  y="149" width="200" height="9" rx="4.5" fill="#3a4658"/>
    <rect x="58"  y="176" width="130" height="9" rx="4.5" fill="#8fb4ff" opacity="0.7"/>
    <rect x="58"  y="203" width="84"  height="9" rx="4.5" fill="#3a4658"/>
    <rect x="150" y="203" width="104" height="9" rx="4.5" fill="#3a4658"/>
    <rect x="58"  y="230" width="170" height="9" rx="4.5" fill="#3a4658"/>
    <rect x="40"  y="257" width="60"  height="9" rx="4.5" fill="#e8825a" opacity="0.8"/>
    <rect x="108" y="257" width="90"  height="9" rx="4.5" fill="#3a4658"/>
    <rect x="40"  y="284" width="140" height="9" rx="4.5" fill="#7fd1a8" opacity="0.6"/>
    <rect x="22"  y="311" width="40"  height="9" rx="4.5" fill="#3a4658"/>
  </g>
</svg>
